<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>ESP32-S3 UVC MJPEG確認</title>
<style>body{font:16px system-ui;max-width:1000px;margin:32px auto;padding:0 20px;background:#101820;color:#e5eef4}img{display:block;width:100%;background:#05090c;min-height:180px;margin:16px 0}pre{white-space:pre-wrap;background:#182733;padding:16px;border-radius:8px}button{padding:10px 20px;margin-right:10px}</style>
<h1>UVCカメラ確認 / MJPEG</h1><p>カラーJPEG・目標6fps以上。この画面は診断用のHTTP映像です。</p>
<p><a id="rtc" style="color:#80d8ff">WebRTC配信を開く</a></p>
<button id="start">映像を再接続</button><button id="stop">映像を停止</button>
<h2 id="state">カメラ状態を確認中…</h2><img id="video" alt="カメラ映像待機中"><pre id="status"></pre>
<p>カメラ未接続・受信停止時は状態欄を確認してください。配信途中で抜いた場合、最後の画像が残ることがあります。</p>
<script>
const video=document.querySelector('#video'),state=document.querySelector('#state'),details=document.querySelector('#status');
const rtcUrl=new URL(location.href);rtcUrl.protocol='https:';rtcUrl.port='443';rtcUrl.pathname='/';document.querySelector('#rtc').href=rtcUrl.href;
function start(){const u=new URL(location.href);u.port='81';u.pathname='/stream';u.search='t='+Date.now();video.src=u.href;}
document.querySelector('#start').onclick=start;document.querySelector('#stop').onclick=()=>video.removeAttribute('src');
let previous=null;
async function poll(){try{
 const r=await fetch('/status',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)throw new Error('HTTP '+r.status);const s=await r.json();
 const now=performance.now();const fps=previous?((s.valid_jpegs-previous.count)*1000/(now-previous.time)).toFixed(2):'—';previous={time:now,count:s.valid_jpegs};
 state.textContent=s.last_frame_age_ms>=0&&s.last_frame_age_ms<2000?'JPEG受信中':s.state==='streaming'?'カメラを開きましたが、有効なJPEGを待っています':s.usb_devices===0?'USB機器未検出：接続・5V給電を確認してください':s.uvc_detections===0?'USB機器あり・UVC未検出':'UVC検出済み・ストリーム開始を確認中';
 details.textContent=`状態: ${s.state} / USB機器: ${s.usb_devices} / UVC検出: ${s.uvc_detections}\n要求: ${s.requested_width}×${s.requested_height} MJPEG ${s.capture_fps}fps / VID:PID ${s.expected_vid.toString(16)}:${s.expected_pid.toString(16)}\n有効JPEG: ${s.valid_jpegs}枚 / 直近受信: ${fps}fps / 最終受信から: ${s.last_frame_age_ms}ms\n受信総数: ${s.frames_received} / 最終サイズ: ${s.last_frame_bytes} bytes / 寸法: ${s.width}×${s.height}\n不正JPEG: ${s.invalid_jpegs} / サイズ超過: ${s.oversized_jpegs} / バッファ超過: ${s.buffer_overflows} / 転送エラー: ${s.transfer_errors}\nオープン試行: ${s.open_attempts} / 最終結果: ${s.last_open_error} / 空きPSRAM: ${s.psram_free} bytes`;
}catch(e){state.textContent='ESPの状態を取得できません: '+e.message;}finally{setTimeout(poll,1000);}}
start();poll();
</script></html>
